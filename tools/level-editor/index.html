<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farhaven Level Editor</title>
<style>
/* ============================================================
   CSS — Dark theme, full-viewport layout
   ============================================================ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg-primary: #1e1e2e;
  --bg-secondary: #2a2a3c;
  --bg-tertiary: #333348;
  --text-primary: #e0e0e8;
  --text-secondary: #a0a0b0;
  --accent: #6ea8fe;
  --accent-hover: #8dbcff;
  --danger: #f06060;
  --warning: #e8a020;
  --success: #60c060;
  --border: #444460;
  --tab-active: #3a3a50;
  --tab-hover: #2f2f45;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  color: var(--text-primary);
  background: var(--bg-primary);
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
}

/* ---- Toolbar ---- */
#toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  min-height: 40px;
}

#toolbar .toolbar-title {
  font-weight: 600;
  font-size: 15px;
  color: var(--accent);
  margin-right: auto;
}

#toolbar button {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 12px;
  cursor: pointer;
  font-size: 13px;
}

#toolbar button:hover {
  background: var(--tab-hover);
}

/* ---- Tabs ---- */
#tabs {
  display: flex;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 0 8px;
}

.tab-btn {
  position: relative;
  background: transparent;
  color: var(--text-secondary);
  border: none;
  border-bottom: 2px solid transparent;
  padding: 8px 16px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: color 0.15s, border-color 0.15s;
}

.tab-btn:hover {
  color: var(--text-primary);
  background: var(--tab-hover);
}

.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  background: var(--tab-active);
}

.tab-dirty {
  position: relative;
}

.tab-dirty::after {
  content: '';
  position: absolute;
  top: 4px;
  right: 4px;
  width: 8px;
  height: 8px;
  background: var(--warning);
  border-radius: 50%;
}

/* ---- Tab Content ---- */
#tab-content {
  flex: 1;
  position: relative;
  overflow: hidden;
}

.tab-panel {
  display: none;
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  overflow: auto;
  padding: 16px;
}

.tab-panel.active {
  display: flex;
}

#tab-map {
  padding: 0;
  flex-direction: row;
}

#tab-map canvas {
  flex: 1;
  min-width: 0;
}

/* #sidebar styles defined in Hex Inspector section below */

/* ---- Map Sidebar (tool selector + palettes) ---- */
#map-sidebar {
  width: 220px;
  min-width: 220px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sidebar-section {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.sidebar-label {
  font-size: 11px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}

.tool-group-header {
  font-size: 10px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 6px;
  margin-bottom: 2px;
}

.tool-group-header:first-child {
  margin-top: 0;
}

.tool-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.tool-btn {
  padding: 4px 8px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-primary);
  cursor: pointer;
  font-size: 12px;
  line-height: 1.2;
}

.tool-btn:hover {
  background: var(--tab-hover);
}

.tool-btn.active {
  background: var(--accent);
  color: var(--bg-primary);
  border-color: var(--accent);
}

.palette {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.palette.hidden {
  display: none;
}

.palette-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 6px;
  cursor: pointer;
  border-radius: 3px;
  font-size: 12px;
  color: var(--text-primary);
}

.palette-item:hover {
  background: var(--bg-tertiary);
}

.palette-item.selected {
  background: var(--tab-active);
  outline: 1px solid var(--accent);
}

.biome-swatch {
  width: 16px;
  height: 16px;
  border-radius: 3px;
  border: 1px solid var(--border);
  flex-shrink: 0;
}

#active-tool-display {
  font-size: 12px;
  color: var(--accent);
  padding: 4px 6px;
  background: var(--bg-tertiary);
  border-radius: 4px;
  min-height: 24px;
}

/* Elevation controls */
.elevation-row {
  display: flex;
  gap: 4px;
  align-items: center;
}

.elevation-row input[type="number"] {
  width: 48px;
  padding: 2px 4px;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: 3px;
  font-size: 12px;
}

.elevation-row button,
.elev-mode-btn {
  padding: 3px 8px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text-primary);
  cursor: pointer;
  font-size: 11px;
}

.elev-mode-btn.active {
  background: var(--accent);
  color: var(--bg-primary);
  border-color: var(--accent);
}

.elevation-row button:hover,
.elev-mode-btn:hover {
  background: var(--tab-hover);
}

#map-selector {
  width: 100%;
  padding: 4px 6px;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12px;
}

#tab-resources, #tab-biomes {
  flex-direction: column;
  gap: 0;
}

/* ---- Master-Detail Editor Layout ---- */
.editor-split {
  display: flex;
  height: calc(100vh - 90px);
  overflow: hidden;
}

.editor-list-panel {
  width: 200px;
  min-width: 200px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--bg-secondary);
}

.editor-list-header {
  padding: 8px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.editor-filter {
  width: 100%;
  padding: 4px 6px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  font-size: 12px;
  box-sizing: border-box;
}

.editor-new-btn {
  padding: 4px 8px;
  background: var(--accent);
  color: var(--bg-primary);
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  width: 100%;
}

.editor-list-items {
  flex: 1;
  overflow-y: auto;
}

.editor-list-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  cursor: pointer;
  font-size: 12px;
  color: var(--text-primary);
  border-bottom: 1px solid var(--border);
}

.editor-list-item:hover {
  background: var(--bg-tertiary);
}

.editor-list-item.active {
  background: var(--accent);
  color: var(--bg-primary);
}

.editor-list-item .swatch {
  width: 14px;
  height: 14px;
  border-radius: 2px;
  border: 1px solid var(--border);
  flex-shrink: 0;
}

.editor-detail-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.editor-detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-secondary);
  gap: 8px;
}

.editor-detail-header h3 {
  margin: 0;
  font-size: 14px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.editor-detail-header .btn-group {
  display: flex;
  gap: 6px;
}

.editor-detail-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg-secondary);
}

.editor-detail-tab {
  padding: 6px 14px;
  font-size: 12px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-secondary);
  cursor: pointer;
}

.editor-detail-tab:hover {
  color: var(--text-primary);
}

.editor-detail-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.editor-detail-body {
  flex: 1;
  overflow-y: auto;
  padding: 10px 14px;
}

.editor-detail-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-secondary);
  font-size: 13px;
}

/* Property grid rows (label-value) */
.prop-grid {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 4px 10px;
  align-items: center;
  font-size: 12px;
}

.prop-grid .prop-label {
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 600;
}

.prop-grid .prop-input {
  width: 100%;
  padding: 3px 6px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  font-size: 12px;
  box-sizing: border-box;
}

.prop-grid .prop-separator {
  grid-column: 1 / -1;
  border-top: 1px solid var(--border);
  margin: 6px 0;
}

.prop-grid .prop-full {
  grid-column: 1 / -1;
}

.editor-btn-save {
  padding: 4px 12px;
  border: none;
  border-radius: 4px;
  background: var(--accent);
  color: var(--bg-primary);
  cursor: pointer;
  font-weight: 600;
  font-size: 11px;
}

.editor-btn-delete {
  padding: 4px 12px;
  border: 1px solid #7a3030;
  border-radius: 4px;
  background: #4a1c1c;
  color: #ff9999;
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
}


/* ---- Hex Inspector (right sidebar) ---- */
#sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--bg-secondary);
  border-left: 1px solid var(--border);
  padding: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

#sidebar .sidebar-section {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}

#sidebar .sidebar-label {
  font-size: 11px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
  display: block;
}

.text-muted {
  color: var(--text-secondary);
  font-size: 12px;
  font-style: italic;
}

.hex-info-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  margin-bottom: 3px;
}

.hex-info-row .biome-swatch {
  width: 12px;
  height: 12px;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin-bottom: 2px;
}

.stat-row .stat-label {
  color: var(--text-secondary);
}

.stat-row .stat-value {
  color: var(--text-primary);
  font-weight: 500;
}

.biome-stat-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  margin-bottom: 2px;
}

.biome-stat-row .biome-swatch {
  width: 10px;
  height: 10px;
}

.prop-card {
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px;
  margin-bottom: 6px;
  background: var(--bg-tertiary);
}

.prop-card-header {
  margin-bottom: 4px;
}

.prop-card-fields {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}

.prop-card-fields label {
  font-size: 11px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 2px;
}

.prop-card-fields input[type="number"] {
  width: 60px;
  padding: 2px 4px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--bg-secondary);
  color: var(--text-primary);
  font-size: 12px;
}

.prop-delete-btn {
  background: var(--danger);
  color: white;
  border: none;
  border-radius: 3px;
  padding: 2px 6px;
  cursor: pointer;
  font-size: 11px;
  font-weight: bold;
  margin-left: auto;
}

.prop-footprint {
  font-size: 10px;
  color: var(--text-secondary);
  margin-top: 2px;
}

/* ---- Editor Workspace ---- */
#editor-workspace {
  display: flex;
  flex-direction: column;
  flex: 1;
}

/* ---- Status Bar ---- */
#status-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 12px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-secondary);
  min-height: 24px;
}

</style>
</head>
<body>
<div id="app">
  <!-- Editor Workspace -->
  <div id="editor-workspace">
    <header id="toolbar">
      <span class="toolbar-title">Farhaven Level Editor</span>
      <span id="tool-indicator" style="font-size:12px;color:var(--text-secondary);"></span>
    </header>
    <nav id="tabs">
      <button class="tab-btn active" data-tab="map">Map Editor</button>
      <button class="tab-btn" data-tab="resources">Resources</button>
      <button class="tab-btn" data-tab="biomes">Biomes</button>
    </nav>
    <main id="tab-content">
      <div id="tab-map" class="tab-panel active">
        <div id="map-sidebar">
          <!-- Map selector -->
          <div class="sidebar-section">
            <label class="sidebar-label">Map</label>
            <select id="map-selector"></select>
          </div>

          <!-- Tool buttons -->
          <div class="sidebar-section">
            <label class="sidebar-label">Tools</label>
            <div id="tool-buttons"></div>
          </div>

          <!-- Active tool display -->
          <div id="active-tool-display" class="sidebar-section">No tool selected</div>

          <!-- Biome palette -->
          <div id="palette-biome" class="sidebar-section palette hidden">
            <label class="sidebar-label">Biomes</label>
            <div id="palette-biome-list"></div>
          </div>

          <!-- Resource palette -->
          <div id="palette-resource" class="sidebar-section palette hidden">
            <label class="sidebar-label">Resources</label>
            <div id="palette-resource-list"></div>
          </div>

          <!-- Structure palette -->
          <div id="palette-structure" class="sidebar-section palette hidden">
            <label class="sidebar-label">Structures</label>
            <div id="palette-structure-list"></div>
          </div>

          <!-- Elevation controls -->
          <div id="palette-elevation" class="sidebar-section palette hidden">
            <label class="sidebar-label">Elevation</label>
            <div class="elevation-row">
              <button class="elev-mode-btn active" data-mode="set">SET</button>
              <button class="elev-mode-btn" data-mode="increment">INCREMENT</button>
            </div>
            <div id="elev-set-controls" class="elevation-row">
              <label style="font-size:11px;color:var(--text-secondary);">Value:</label>
              <input type="number" id="elev-value" min="0" max="9" value="0">
            </div>
            <div id="elev-inc-controls" class="elevation-row" style="display:none;">
              <button id="elev-dec">-1</button>
              <button id="elev-inc">+1</button>
            </div>
          </div>
        </div>
        <canvas id="hex-canvas"></canvas>
        <aside id="sidebar">
          <div class="sidebar-section" id="map-stats">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:4px;">
              <label class="sidebar-label" style="margin-bottom:0;">Map Info</label>
              <div style="display:flex;gap:4px;">
                <button id="btn-save" type="button" title="Save All (Ctrl+S)" style="font-size:11px;padding:2px 8px;">Save</button>
                <button id="btn-save-as" type="button" title="Save As (Ctrl+Shift+S)" style="font-size:11px;padding:2px 8px;">Save As</button>
              </div>
            </div>
            <div id="map-stats-content"></div>
          </div>
          <div class="sidebar-section" id="hex-info">
            <label class="sidebar-label">Hex Details</label>
            <div id="hex-info-content"><span class="text-muted">Hover a hex to inspect</span></div>
          </div>
          <div class="sidebar-section" id="prop-editor">
            <label class="sidebar-label">Props</label>
            <div id="prop-editor-content"></div>
          </div>
        </aside>
      </div>
      <div id="tab-resources" class="tab-panel">
        <p style="color: var(--text-secondary);">Resource Editor — coming in delivery-003.</p>
      </div>
      <div id="tab-biomes" class="tab-panel">
        <p style="color: var(--text-secondary);">Biome Editor — coming in delivery-003.</p>
      </div>
    </main>
    <footer id="status-bar">
      <span id="status-text">Ready</span>
    </footer>
  </div>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
