<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farhaven Level Editor</title>
<style>
/* ============================================================
   CSS — Dark theme, full-viewport layout
   ============================================================ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg-primary: #1e1e2e;
  --bg-secondary: #2a2a3c;
  --bg-tertiary: #333348;
  --text-primary: #e0e0e8;
  --text-secondary: #a0a0b0;
  --accent: #6ea8fe;
  --accent-hover: #8dbcff;
  --danger: #f06060;
  --warning: #e8a020;
  --success: #60c060;
  --border: #444460;
  --tab-active: #3a3a50;
  --tab-hover: #2f2f45;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  color: var(--text-primary);
  background: var(--bg-primary);
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
}

/* ---- Toolbar ---- */
#toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  min-height: 40px;
}

#toolbar .toolbar-title {
  font-weight: 600;
  font-size: 15px;
  color: var(--accent);
  margin-right: auto;
}

#toolbar button {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 12px;
  cursor: pointer;
  font-size: 13px;
}

#toolbar button:hover {
  background: var(--tab-hover);
}

/* ---- Tabs ---- */
#tabs {
  display: flex;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 0 8px;
}

.tab-btn {
  position: relative;
  background: transparent;
  color: var(--text-secondary);
  border: none;
  border-bottom: 2px solid transparent;
  padding: 8px 16px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: color 0.15s, border-color 0.15s;
}

.tab-btn:hover {
  color: var(--text-primary);
  background: var(--tab-hover);
}

.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  background: var(--tab-active);
}

.tab-dirty {
  position: relative;
}

.tab-dirty::after {
  content: '';
  position: absolute;
  top: 4px;
  right: 4px;
  width: 8px;
  height: 8px;
  background: var(--warning);
  border-radius: 50%;
}

/* ---- Tab Content ---- */
#tab-content {
  flex: 1;
  position: relative;
  overflow: hidden;
}

.tab-panel {
  display: none;
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  overflow: auto;
  padding: 16px;
}

.tab-panel.active {
  display: flex;
}

#tab-map {
  padding: 0;
}

#tab-map canvas {
  flex: 1;
}

#tab-map #sidebar {
  width: 280px;
  background: var(--bg-secondary);
  border-left: 1px solid var(--border);
  padding: 12px;
  overflow-y: auto;
}

#tab-resources, #tab-biomes {
  flex-direction: column;
  gap: 12px;
}

/* ---- Welcome Overlay ---- */
#welcome {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  background: var(--bg-primary);
  z-index: 100;
}

#welcome.hidden {
  display: none;
}

#welcome h1 {
  font-size: 28px;
  color: var(--accent);
  font-weight: 700;
}

#welcome p {
  color: var(--text-secondary);
  font-size: 16px;
  max-width: 480px;
  text-align: center;
  line-height: 1.6;
}

#welcome button {
  background: var(--accent);
  color: var(--bg-primary);
  border: none;
  border-radius: 6px;
  padding: 12px 32px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}

#welcome button:hover {
  background: var(--accent-hover);
}

#error-banner {
  display: none;
  color: var(--danger);
  font-size: 14px;
  padding: 8px 16px;
  background: rgba(240, 96, 96, 0.1);
  border: 1px solid var(--danger);
  border-radius: 4px;
  max-width: 480px;
  text-align: center;
}

#error-banner.visible {
  display: block;
}

/* ---- Hex Tooltip ---- */
#hex-tooltip {
  display: none;
  position: absolute;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 10px;
  font-size: 12px;
  pointer-events: none;
  z-index: 200;
  white-space: nowrap;
}

/* ---- Editor Workspace ---- */
#editor-workspace {
  display: none;
  flex-direction: column;
  flex: 1;
}

#editor-workspace.visible {
  display: flex;
}

/* ---- Status Bar ---- */
#status-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 12px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-secondary);
  min-height: 24px;
}

/* ---- Fallback file input (hidden, used for non-FSA browsers) ---- */
#fallback-file-input {
  display: none;
}
</style>
</head>
<body>
<div id="app">
  <!-- Welcome Overlay — visible on load -->
  <div id="welcome">
    <h1>Farhaven Level Editor</h1>
    <p>Open your Farhaven project folder to begin editing maps, resources, and biomes.</p>
    <button id="btn-open-project" type="button">Open Project</button>
    <div id="error-banner"></div>
    <input type="file" id="fallback-file-input" webkitdirectory>
  </div>

  <!-- Editor Workspace — hidden until project is opened -->
  <div id="editor-workspace">
    <header id="toolbar">
      <span class="toolbar-title">Farhaven Level Editor</span>
      <button id="btn-save" type="button" title="Save All (Ctrl+S)">Save</button>
    </header>
    <nav id="tabs">
      <button class="tab-btn active" data-tab="map">Map Editor</button>
      <button class="tab-btn" data-tab="resources">Resources</button>
      <button class="tab-btn" data-tab="biomes">Biomes</button>
    </nav>
    <main id="tab-content">
      <div id="tab-map" class="tab-panel active">
        <canvas id="hex-canvas"></canvas>
        <aside id="sidebar"><!-- Palette & Sidebar (feature-003) --></aside>
      </div>
      <div id="tab-resources" class="tab-panel">
        <p style="color: var(--text-secondary);">Resource Editor — coming in delivery-003.</p>
      </div>
      <div id="tab-biomes" class="tab-panel">
        <p style="color: var(--text-secondary);">Biome Editor — coming in delivery-003.</p>
      </div>
    </main>
    <footer id="status-bar">
      <span id="status-text">Ready</span>
    </footer>
  </div>

  <div id="hex-tooltip"></div>
</div>

<script>
'use strict';

// ============================================================
// Module-level state
// ============================================================

/** @type {string} Currently active tab — 'map' | 'resources' | 'biomes' */
let activeTab = 'map';

// ============================================================
// Tab Switching (task-001)
// ============================================================

/** @type {Object<string, string>} Base labels for each tab */
const TAB_LABELS = {
  map: 'Map Editor',
  resources: 'Resources',
  biomes: 'Biomes',
};

/**
 * Switch to the specified tab.
 * @param {string} tabName - 'map' | 'resources' | 'biomes'
 * @returns {void}
 */
function switchTab(tabName) {
  if (!TAB_LABELS[tabName]) return;
  activeTab = tabName;

  // Update tab buttons
  document.querySelectorAll('.tab-btn').forEach(btn => {
    if (btn.dataset.tab === tabName) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });

  // Update tab panels
  document.querySelectorAll('.tab-panel').forEach(panel => {
    if (panel.id === 'tab-' + tabName) {
      panel.classList.add('active');
    } else {
      panel.classList.remove('active');
    }
  });
}

// Wire tab click handlers
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    switchTab(btn.dataset.tab);
  });
});

// ============================================================
// TresParser — Parse and Serialize .tres files (task-003)
// ============================================================

/**
 * @typedef {Object} TresValue
 * @property {string} type - 'string'|'stringname'|'int'|'float'|'bool'|'color'|'vector2i'|'ext_resource'|'dict'|'array'|'packed_string_array'
 * @property {*} value
 * @property {string} [elementType] - For typed arrays
 * @property {string} [keyStyle] - For dicts: 'stringname' or 'string'
 */

/**
 * Intermediate representation preserving the full .tres file structure.
 */
class TresFile {
  constructor() {
    /** @type {string} */
    this.headerLine = '';
    /** @type {string[]} */
    this.extResources = [];
    /** @type {Map<string, TresValue>} Ordered map of [resource] key-value pairs */
    this.resourceFields = new Map();
    /** @type {string|null} */
    this.uid = null;
    /** @type {string} */
    this.scriptClass = '';
    /** @type {string} Line ending style detected from source: '\r\n' or '\n' */
    this.lineEnding = '\n';
  }
}

/**
 * Parses and serializes Godot .tres resource files.
 * Round-trip safe: serialize(parse(text)) === text for well-formed files.
 */
class TresParser {
  /**
   * Parse a .tres file string into a TresFile object.
   * @param {string} text
   * @returns {TresFile}
   */
  static parse(text) {
    const file = new TresFile();

    // Detect and preserve line ending style
    if (text.indexOf('\r\n') !== -1) {
      file.lineEnding = '\r\n';
    } else {
      file.lineEnding = '\n';
    }

    // Normalize to \n for parsing
    const normalized = text.replace(/\r\n/g, '\n');
    const lines = normalized.split('\n');

    /** @type {'header'|'between_header_ext'|'ext_resources'|'between_ext_resource'|'resource'} */
    let section = 'header';
    let sawBlankAfterHeader = false;
    let sawBlankAfterExt = false;

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];

      // Header line
      if (section === 'header') {
        if (line.startsWith('[gd_resource')) {
          file.headerLine = line;

          // Extract uid from header
          const uidMatch = line.match(/uid="([^"]+)"/);
          if (uidMatch) {
            file.uid = uidMatch[1];
          }

          // Extract script_class from header
          const scMatch = line.match(/script_class="([^"]+)"/);
          if (scMatch) {
            file.scriptClass = scMatch[1];
          }

          section = 'between_header_ext';
          continue;
        }
        // Skip any leading empty lines
        if (line.trim() === '') continue;
        throw new Error(`TresParser: Expected [gd_resource ...] header at line ${i + 1}, got: "${line}"`);
      }

      // Between header and ext_resource / [resource] section
      if (section === 'between_header_ext') {
        if (line.trim() === '') {
          sawBlankAfterHeader = true;
          continue;
        }
        if (line.startsWith('[ext_resource')) {
          file.extResources.push(line);
          section = 'ext_resources';
          continue;
        }
        if (line === '[resource]') {
          section = 'resource';
          continue;
        }
        continue;
      }

      // Collecting ext_resource lines
      if (section === 'ext_resources') {
        if (line.startsWith('[ext_resource')) {
          file.extResources.push(line);
          continue;
        }
        if (line.trim() === '') {
          section = 'between_ext_resource';
          continue;
        }
        if (line === '[resource]') {
          section = 'resource';
          continue;
        }
        continue;
      }

      // Between ext_resources and [resource]
      if (section === 'between_ext_resource') {
        if (line.trim() === '') continue;
        if (line === '[resource]') {
          section = 'resource';
          continue;
        }
        continue;
      }

      // [resource] section — parse key = value pairs
      if (section === 'resource') {
        if (line.trim() === '') continue;
        const eqIndex = line.indexOf(' = ');
        if (eqIndex === -1) continue;
        const key = line.substring(0, eqIndex);
        const valueStr = line.substring(eqIndex + 3);
        file.resourceFields.set(key, TresParser.parseValue(valueStr));
      }
    }

    return file;
  }

  /**
   * Parse a single .tres value string into a TresValue.
   * @param {string} valueStr
   * @returns {TresValue}
   */
  static parseValue(valueStr) {
    const s = valueStr.trim();

    // StringName: &"..."
    if (s.startsWith('&"')) {
      const inner = s.slice(2, -1);
      return { type: 'stringname', value: inner };
    }

    // ExtResource: ExtResource("...")
    if (s.startsWith('ExtResource(')) {
      return { type: 'ext_resource', value: s };
    }

    // Color: Color(r, g, b, a)
    if (s.startsWith('Color(')) {
      const inner = s.slice(6, -1);
      const rawParts = inner.split(',').map(p => p.trim());
      return {
        type: 'color',
        value: {
          r: parseFloat(rawParts[0]),
          g: parseFloat(rawParts[1]),
          b: parseFloat(rawParts[2]),
          a: parseFloat(rawParts[3]),
        },
        raw: rawParts,
      };
    }

    // Vector2i: Vector2i(x, y)
    if (s.startsWith('Vector2i(')) {
      const inner = s.slice(9, -1);
      const parts = inner.split(',').map(p => parseInt(p.trim(), 10));
      return { type: 'vector2i', value: { x: parts[0], y: parts[1] } };
    }

    // PackedStringArray: PackedStringArray("a", "b")
    if (s.startsWith('PackedStringArray(')) {
      const inner = s.slice(18, -1);
      if (inner.trim() === '') return { type: 'packed_string_array', value: [] };
      const values = [];
      const re = /"([^"]*)"/g;
      let m;
      while ((m = re.exec(inner)) !== null) {
        values.push(m[1]);
      }
      return { type: 'packed_string_array', value: values };
    }

    // PackedColorArray: PackedColorArray(...) -> typed array with Color
    if (s.startsWith('PackedColorArray(')) {
      const inner = s.slice(17, -1);
      const colors = TresParser._parseColorList(inner);
      return { type: 'array', value: colors, elementType: 'Color' };
    }

    // Typed array: Array[Type](...)
    if (s.startsWith('Array[')) {
      const bracketEnd = s.indexOf(']');
      const elementType = s.substring(6, bracketEnd);
      const parenStart = s.indexOf('(', bracketEnd);
      const inner = s.slice(parenStart + 1, -1);
      const elements = TresParser._parseArrayElements(inner, elementType);
      return { type: 'array', value: elements, elementType: elementType };
    }

    // Bool
    if (s === 'true') return { type: 'bool', value: true };
    if (s === 'false') return { type: 'bool', value: false };

    // String: "..."
    if (s.startsWith('"') && s.endsWith('"')) {
      return { type: 'string', value: s.slice(1, -1) };
    }

    // Dict: { ... }
    if (s.startsWith('{')) {
      return TresParser._parseDict(s);
    }

    // Untyped array: [ ... ]
    if (s.startsWith('[')) {
      const inner = s.slice(1, -1).trim();
      if (inner === '') return { type: 'array', value: [], elementType: null };
      const elements = TresParser._parseArrayElements(inner, null);
      return { type: 'array', value: elements, elementType: null };
    }

    // Number: float vs int
    if (/^-?\d+\.\d*$/.test(s) || /^-?\d*\.\d+$/.test(s)) {
      return { type: 'float', value: parseFloat(s) };
    }
    if (/^-?\d+$/.test(s)) {
      return { type: 'int', value: parseInt(s, 10) };
    }

    // Fallback: treat as string
    return { type: 'string', value: s };
  }

  /**
   * Parse a dictionary value string.
   * @param {string} s - The full dict string including braces
   * @returns {TresValue}
   */
  static _parseDict(s) {
    const inner = s.slice(1, -1).trim();
    if (inner === '') {
      // Detect brace style: '{}' vs '{ }' — check for space after opening brace
      const hasSpaces = s.length > 2 && s[1] === ' ';
      return { type: 'dict', value: new Map(), keyStyle: 'stringname', braceSpaces: hasSpaces };
    }

    // Detect key style from the first key
    const keyStyle = inner.startsWith('&"') ? 'stringname' : 'string';

    // Detect brace spacing from original string
    // "{ &..." or "{ \"..." = spaces; "{&..." or "{\"..." = no spaces
    const braceSpaces = s[1] === ' ';

    const entries = new Map();
    // Parse key: value pairs, handling nested structures
    let pos = 0;
    while (pos < inner.length) {
      // Skip whitespace
      while (pos < inner.length && (inner[pos] === ' ' || inner[pos] === '\t')) pos++;
      if (pos >= inner.length) break;

      // Parse key
      let key;
      if (inner[pos] === '&' && inner[pos + 1] === '"') {
        // StringName key: &"key"
        pos += 2;
        const endQuote = inner.indexOf('"', pos);
        key = inner.substring(pos, endQuote);
        pos = endQuote + 1;
      } else if (inner[pos] === '"') {
        // String key: "key"
        pos += 1;
        const endQuote = inner.indexOf('"', pos);
        key = inner.substring(pos, endQuote);
        pos = endQuote + 1;
      } else {
        break;
      }

      // Skip ': ' or ':'
      while (pos < inner.length && (inner[pos] === ':' || inner[pos] === ' ')) pos++;

      // Parse value — find end considering nesting
      const valueStart = pos;
      pos = TresParser._findValueEnd(inner, pos);
      const valueStr = inner.substring(valueStart, pos).trim();
      entries.set(key, TresParser.parseValue(valueStr));

      // Skip comma and whitespace
      while (pos < inner.length && (inner[pos] === ',' || inner[pos] === ' ')) pos++;
    }

    return { type: 'dict', value: entries, keyStyle: keyStyle, braceSpaces: braceSpaces };
  }

  /**
   * Find the end position of a value in a comma-separated context.
   * Handles nested braces, brackets, parentheses, and quoted strings.
   * @param {string} s
   * @param {number} start
   * @returns {number}
   */
  static _findValueEnd(s, start) {
    let depth = 0;
    let inString = false;
    let i = start;
    while (i < s.length) {
      const ch = s[i];
      if (inString) {
        if (ch === '\\') { i += 2; continue; }
        if (ch === '"') inString = false;
        i++;
        continue;
      }
      if (ch === '"') { inString = true; i++; continue; }
      if (ch === '{' || ch === '[' || ch === '(') { depth++; i++; continue; }
      if (ch === '}' || ch === ']' || ch === ')') {
        if (depth === 0) return i;
        depth--;
        i++;
        continue;
      }
      if (ch === ',' && depth === 0) return i;
      i++;
    }
    return i;
  }

  /**
   * Parse comma-separated array elements.
   * @param {string} inner - Content between brackets/parens
   * @param {string|null} elementType
   * @returns {TresValue[]}
   */
  static _parseArrayElements(inner, elementType) {
    if (inner.trim() === '') return [];
    const elements = [];
    let pos = 0;
    while (pos < inner.length) {
      // Skip whitespace
      while (pos < inner.length && (inner[pos] === ' ' || inner[pos] === '\t')) pos++;
      if (pos >= inner.length) break;

      const valueStart = pos;
      pos = TresParser._findValueEnd(inner, pos);
      let valueStr = inner.substring(valueStart, pos).trim();

      // Handle the closing character being part of the match
      if (pos < inner.length && (inner[pos] === '}' || inner[pos] === ')')) {
        valueStr = inner.substring(valueStart, pos + 1).trim();
        pos++;
      }

      if (valueStr !== '') {
        elements.push(TresParser.parseValue(valueStr));
      }

      // Skip comma and whitespace
      if (pos < inner.length && inner[pos] === ',') pos++;
      while (pos < inner.length && inner[pos] === ' ') pos++;
    }
    return elements;
  }

  /**
   * Parse a comma-separated list of Color(...) values.
   * @param {string} inner
   * @returns {TresValue[]}
   */
  static _parseColorList(inner) {
    const colors = [];
    const re = /Color\([^)]+\)/g;
    let m;
    while ((m = re.exec(inner)) !== null) {
      colors.push(TresParser.parseValue(m[0]));
    }
    return colors;
  }

  /**
   * Serialize a TresFile back to a .tres string.
   * @param {TresFile} tresFile
   * @returns {string}
   */
  static serialize(tresFile) {
    const eol = tresFile.lineEnding || '\n';
    const parts = [];

    // Header line
    parts.push(tresFile.headerLine);

    // Blank line between header and ext_resources
    if (tresFile.extResources.length > 0) {
      parts.push('');
      for (const ext of tresFile.extResources) {
        parts.push(ext);
      }
    }

    // Blank line before [resource]
    parts.push('');
    parts.push('[resource]');

    // Resource fields
    for (const [key, value] of tresFile.resourceFields) {
      parts.push(key + ' = ' + TresParser.serializeValue(value));
    }

    return parts.join(eol) + eol;
  }

  /**
   * Serialize a TresValue back to its .tres string representation.
   * @param {TresValue} tv
   * @returns {string}
   */
  static serializeValue(tv) {
    switch (tv.type) {
      case 'stringname':
        return '&"' + tv.value + '"';
      case 'string':
        return '"' + tv.value + '"';
      case 'int':
        return String(tv.value);
      case 'float':
        return TresParser._serializeFloat(tv.value);
      case 'bool':
        return tv.value ? 'true' : 'false';
      case 'color':
        if (tv.raw) {
          return 'Color(' + tv.raw.join(', ') + ')';
        }
        return 'Color(' + TresParser._serializeFloat(tv.value.r)
          + ', ' + TresParser._serializeFloat(tv.value.g)
          + ', ' + TresParser._serializeFloat(tv.value.b)
          + ', ' + TresParser._serializeFloat(tv.value.a) + ')';
      case 'vector2i':
        return 'Vector2i(' + tv.value.x + ', ' + tv.value.y + ')';
      case 'ext_resource':
        return tv.value;
      case 'dict':
        return TresParser._serializeDict(tv);
      case 'array':
        return TresParser._serializeArray(tv);
      case 'packed_string_array':
        if (tv.value.length === 0) return 'PackedStringArray()';
        return 'PackedStringArray(' + tv.value.map(v => '"' + v + '"').join(', ') + ')';
      default:
        return String(tv.value);
    }
  }

  /**
   * Serialize a float value, ensuring it always has a decimal point.
   * @param {number} val
   * @returns {string}
   */
  static _serializeFloat(val) {
    const s = String(val);
    if (s.indexOf('.') === -1 && s.indexOf('e') === -1) {
      return s + '.0';
    }
    return s;
  }

  /**
   * Serialize a dict TresValue.
   * @param {TresValue} tv
   * @returns {string}
   */
  static _serializeDict(tv) {
    const map = tv.value;
    if (map.size === 0) return '{}';

    const keyStyle = tv.keyStyle || 'stringname';
    const pairs = [];
    for (const [key, val] of map) {
      const serializedKey = keyStyle === 'stringname'
        ? '&"' + key + '"'
        : '"' + key + '"';
      pairs.push(serializedKey + ': ' + TresParser.serializeValue(val));
    }

    // Use stored brace spacing style, defaulting to spaces
    const useSpaces = tv.braceSpaces !== undefined ? tv.braceSpaces : true;
    if (useSpaces) {
      return '{ ' + pairs.join(', ') + ' }';
    }
    return '{' + pairs.join(', ') + '}';
  }

  /**
   * Serialize an array TresValue.
   * @param {TresValue} tv
   * @returns {string}
   */
  static _serializeArray(tv) {
    const elements = tv.value;
    if (tv.elementType) {
      // Typed array: Array[Type](...)
      if (elements.length === 0) {
        return 'Array[' + tv.elementType + ']()';
      }
      return 'Array[' + tv.elementType + '](' + elements.map(e => TresParser.serializeValue(e)).join(', ') + ')';
    }
    // Untyped array: [...]
    if (elements.length === 0) return '[]';
    return '[' + elements.map(e => TresParser.serializeValue(e)).join(', ') + ']';
  }
}

/**
 * Generate a Godot-format uid for new .tres files.
 * @returns {string}
 */
function generateTresUid() {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let id = 'uid://c';
  for (let i = 0; i < 13; i++) {
    id += chars[Math.floor(Math.random() * chars.length)];
  }
  return id;
}

// ============================================================
// FileDiscovery (task-002)
// ============================================================

class FileDiscovery {
  /**
   * Navigate from root to a subdirectory path like 'data/maps'.
   * @param {FileSystemDirectoryHandle} rootHandle
   * @param {string} path
   * @returns {Promise<FileSystemDirectoryHandle|null>}
   */
  static async getSubdirectory(rootHandle, path) {
    const parts = path.split('/');
    let current = rootHandle;
    for (const part of parts) {
      try {
        current = await current.getDirectoryHandle(part);
      } catch (err) {
        return null;
      }
    }
    return current;
  }

  /**
   * Scan a directory for files matching the given extension.
   * @param {FileSystemDirectoryHandle} rootHandle
   * @param {string} path - Subdirectory path e.g. 'data/maps'
   * @param {string} extension - File extension e.g. '.json'
   * @returns {Promise<Array<{name: string, handle: FileSystemFileHandle}>>}
   */
  static async scanDirectory(rootHandle, path, extension) {
    const dirHandle = await FileDiscovery.getSubdirectory(rootHandle, path);
    if (!dirHandle) {
      console.warn(`FileDiscovery: Directory "${path}" not found. Continuing without it.`);
      return [];
    }
    const results = [];
    for await (const [name, handle] of dirHandle) {
      if (handle.kind === 'file' && name.endsWith(extension)) {
        results.push({ name, handle });
      }
    }
    return results;
  }

  /**
   * Full discovery flow: validate root, scan all three dirs, parse files.
   * @param {FileSystemDirectoryHandle} rootHandle
   * @returns {Promise<{success: boolean, error?: string}>}
   */
  static async discoverProject(rootHandle) {
    // Validate project root
    try {
      await rootHandle.getFileHandle('project.godot');
    } catch (err) {
      return { success: false, error: 'Not a Godot project. Please select the folder containing project.godot.' };
    }

    ProjectContext.rootHandle = rootHandle;

    // Scan directories
    const mapFiles = await FileDiscovery.scanDirectory(rootHandle, 'data/maps', '.json');
    const resourceFiles = await FileDiscovery.scanDirectory(rootHandle, 'data/resources', '.tres');
    const biomeFiles = await FileDiscovery.scanDirectory(rootHandle, 'data/biomes', '.tres');

    // Parse map files
    for (const { name, handle } of mapFiles) {
      try {
        const file = await handle.getFile();
        const text = await file.text();
        const data = JSON.parse(text);
        ProjectContext.files.maps.set(name, { handle, data });
      } catch (err) {
        console.warn(`FileDiscovery: Failed to parse map "${name}": ${err.message}. Skipping.`);
      }
    }

    // Parse resource files
    for (const { name, handle } of resourceFiles) {
      try {
        const file = await handle.getFile();
        const text = await file.text();
        const raw = TresParser.parse(text);
        if (raw.scriptClass !== 'ResourceDef') {
          console.warn(`FileDiscovery: "${name}" has scriptClass "${raw.scriptClass}", expected "ResourceDef". Skipping.`);
          continue;
        }

        // Round-trip validation
        const roundTrip = TresParser.serialize(raw);
        if (roundTrip !== text) {
          console.warn(`FileDiscovery: Round-trip mismatch for "${name}". Parser output differs from original.`);
        }

        // Build data object from resource fields
        const data = {};
        for (const [key, tv] of raw.resourceFields) {
          data[key] = tv.value;
        }
        ProjectContext.files.resources.set(name, { handle, data, raw });
      } catch (err) {
        console.warn(`FileDiscovery: Failed to parse resource "${name}": ${err.message}. Skipping.`);
      }
    }

    // Parse biome files
    for (const { name, handle } of biomeFiles) {
      try {
        const file = await handle.getFile();
        const text = await file.text();
        const raw = TresParser.parse(text);
        if (raw.scriptClass !== 'BiomeData') {
          console.warn(`FileDiscovery: "${name}" has scriptClass "${raw.scriptClass}", expected "BiomeData". Skipping.`);
          continue;
        }

        // Round-trip validation
        const roundTrip = TresParser.serialize(raw);
        if (roundTrip !== text) {
          console.warn(`FileDiscovery: Round-trip mismatch for "${name}". Parser output differs from original.`);
        }

        // Build data object from resource fields
        const data = {};
        for (const [key, tv] of raw.resourceFields) {
          data[key] = tv.value;
        }
        ProjectContext.files.biomes.set(name, { handle, data, raw });
      } catch (err) {
        console.warn(`FileDiscovery: Failed to parse biome "${name}": ${err.message}. Skipping.`);
      }
    }

    return { success: true };
  }

  /**
   * Fallback: process FileList from <input webkitdirectory>.
   * @param {FileList} fileList
   * @returns {Promise<{success: boolean, error?: string}>}
   */
  static async discoverFromFileList(fileList) {
    // Validate: check for project.godot at root level
    let hasProjectGodot = false;
    /** @type {string} */
    let rootPrefix = '';

    for (const file of fileList) {
      const parts = file.webkitRelativePath.split('/');
      if (parts.length === 2 && parts[1] === 'project.godot') {
        hasProjectGodot = true;
        rootPrefix = parts[0] + '/';
        break;
      }
    }

    if (!hasProjectGodot) {
      return { success: false, error: 'Not a Godot project. Please select the folder containing project.godot.' };
    }

    /**
     * Read a File as text.
     * @param {File} file
     * @returns {Promise<string>}
     */
    function readFileText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(/** @type {string} */ (reader.result));
        reader.onerror = () => reject(reader.error);
        reader.readAsText(file);
      });
    }

    // Categorize files
    for (const file of fileList) {
      const relPath = file.webkitRelativePath.substring(rootPrefix.length);

      try {
        if (relPath.startsWith('data/maps/') && relPath.endsWith('.json')) {
          const name = relPath.split('/').pop();
          const text = await readFileText(file);
          const data = JSON.parse(text);
          ProjectContext.files.maps.set(name, { handle: null, data });
        } else if (relPath.startsWith('data/resources/') && relPath.endsWith('.tres')) {
          const name = relPath.split('/').pop();
          const text = await readFileText(file);
          const raw = TresParser.parse(text);
          if (raw.scriptClass !== 'ResourceDef') {
            console.warn(`FileDiscovery: "${name}" has scriptClass "${raw.scriptClass}", expected "ResourceDef". Skipping.`);
            continue;
          }
          const roundTrip = TresParser.serialize(raw);
          if (roundTrip !== text) {
            console.warn(`FileDiscovery: Round-trip mismatch for "${name}".`);
          }
          const data = {};
          for (const [key, tv] of raw.resourceFields) {
            data[key] = tv.value;
          }
          ProjectContext.files.resources.set(name, { handle: null, data, raw });
        } else if (relPath.startsWith('data/biomes/') && relPath.endsWith('.tres')) {
          const name = relPath.split('/').pop();
          const text = await readFileText(file);
          const raw = TresParser.parse(text);
          if (raw.scriptClass !== 'BiomeData') {
            console.warn(`FileDiscovery: "${name}" has scriptClass "${raw.scriptClass}", expected "BiomeData". Skipping.`);
            continue;
          }
          const roundTrip = TresParser.serialize(raw);
          if (roundTrip !== text) {
            console.warn(`FileDiscovery: Round-trip mismatch for "${name}".`);
          }
          const data = {};
          for (const [key, tv] of raw.resourceFields) {
            data[key] = tv.value;
          }
          ProjectContext.files.biomes.set(name, { handle: null, data, raw });
        }
      } catch (err) {
        const name = file.webkitRelativePath.split('/').pop();
        console.warn(`FileDiscovery: Failed to parse "${name}": ${err.message}. Skipping.`);
      }
    }

    return { success: true };
  }

  /**
   * Save a single file. Uses FileSystemFileHandle if available, else downloads.
   * @param {FileSystemFileHandle|null} handle
   * @param {string} content - Serialized JSON or .tres
   * @param {string} filename - For download fallback
   * @returns {Promise<void>}
   */
  static async saveFile(handle, content, filename) {
    if (handle && typeof handle.createWritable === 'function') {
      // File System Access API path
      const writable = await handle.createWritable();
      await writable.write(content);
      await writable.close();
    } else {
      // Fallback: Blob + <a download>
      const blob = new Blob([content], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  }
}

class CommandHistory {
  constructor() {
    /** @type {Array<Object>} Most recent at end */
    this.undoStack = [];
    /** @type {Array<Object>} Most recent at end */
    this.redoStack = [];
    /** @type {number} */
    this.maxSize = 50;
    /** @type {function(string, Object):void|null} callback: (action, command) => void */
    this.onChange = null;
  }

  /**
   * Execute a new command and push to undo stack.
   * @param {Object} command - Command object with execute(), undo(), type, tab
   * @returns {void}
   */
  execute(command) {
    command.execute();
    this.undoStack.push(command);
    this.redoStack.length = 0;
    if (this.undoStack.length > this.maxSize) {
      this.undoStack.shift();
    }
    if (this.onChange) {
      this.onChange('execute', command);
    }
  }

  /**
   * Undo the most recent command.
   * @returns {void}
   */
  undo() {
    if (this.undoStack.length === 0) return;
    const command = this.undoStack.pop();
    command.undo();
    this.redoStack.push(command);
    if (this.onChange) {
      this.onChange('undo', command);
    }
  }

  /**
   * Redo the most recently undone command.
   * @returns {void}
   */
  redo() {
    if (this.redoStack.length === 0) return;
    const command = this.redoStack.pop();
    command.execute();
    this.undoStack.push(command);
    if (this.onChange) {
      this.onChange('redo', command);
    }
  }

  /**
   * @returns {boolean}
   */
  canUndo() {
    return this.undoStack.length > 0;
  }

  /**
   * @returns {boolean}
   */
  canRedo() {
    return this.redoStack.length > 0;
  }

  /**
   * Clear both stacks.
   * @returns {void}
   */
  clear() {
    this.undoStack.length = 0;
    this.redoStack.length = 0;
    if (this.onChange) {
      this.onChange('clear', null);
    }
  }
}

/** @type {CommandHistory} */
const commandHistory = new CommandHistory();

// KeyboardManager (task-004)

class KeyboardManager {
  constructor() {
    /** @type {Map<string, function():void>} */
    this.shortcuts = new Map();
    /** @type {boolean} */
    this.enabled = true;

    document.addEventListener('keydown', (e) => this._handleKeydown(e));
  }

  /**
   * Register a shortcut.
   * @param {string} combo - e.g. 'ctrl+z', 'b', 'escape'
   * @param {function():void} handler
   * @returns {void}
   */
  register(combo, handler) {
    this.shortcuts.set(combo.toLowerCase(), handler);
  }

  /**
   * Unregister a shortcut.
   * @param {string} combo
   * @returns {void}
   */
  unregister(combo) {
    this.shortcuts.delete(combo.toLowerCase());
  }

  /**
   * Normalize a KeyboardEvent to a combo string.
   * Modifier order: ctrl+shift+alt+key (lowercase).
   * @param {KeyboardEvent} event
   * @returns {string}
   */
  _normalizeEvent(event) {
    const parts = [];
    if (event.ctrlKey || event.metaKey) parts.push('ctrl');
    if (event.shiftKey) parts.push('shift');
    if (event.altKey) parts.push('alt');
    const key = event.key.toLowerCase();
    // Avoid duplicating modifier names as the key itself
    if (key !== 'control' && key !== 'shift' && key !== 'alt' && key !== 'meta') {
      parts.push(key);
    }
    return parts.join('+');
  }

  /**
   * Handle keydown events. Dispatch matching shortcuts.
   * @param {KeyboardEvent} event
   * @returns {void}
   */
  _handleKeydown(event) {
    if (!this.enabled) return;

    const combo = this._normalizeEvent(event);
    const handler = this.shortcuts.get(combo);
    if (!handler) return;

    // Check if a text input is focused — suppress single-key shortcuts
    const el = document.activeElement;
    const isTextInput = el && (
      el.tagName === 'INPUT' ||
      el.tagName === 'TEXTAREA' ||
      el.hasAttribute('contenteditable')
    );

    // Single-key shortcuts (no modifier) should be suppressed in text inputs
    const hasModifier = event.ctrlKey || event.metaKey || event.altKey;
    if (isTextInput && !hasModifier) return;

    event.preventDefault();
    handler();
  }
}

// DirtyTracker (task-005)

class DirtyTracker {
  constructor() {
    /** @type {Set<string>} */
    this.dirtyTabs = new Set();
    /** @type {function():void|null} */
    this.onChange = null;
  }

  /**
   * Mark a tab as dirty.
   * @param {string} tab - 'map' | 'resources' | 'biomes'
   * @returns {void}
   */
  markDirty(tab) {
    if (!this.dirtyTabs.has(tab)) {
      this.dirtyTabs.add(tab);
      if (this.onChange) this.onChange();
    }
  }

  /**
   * Clear dirty flag for a tab.
   * @param {string} tab
   * @returns {void}
   */
  markClean(tab) {
    if (this.dirtyTabs.has(tab)) {
      this.dirtyTabs.delete(tab);
      if (this.onChange) this.onChange();
    }
  }

  /**
   * Clear all dirty flags.
   * @returns {void}
   */
  markAllClean() {
    if (this.dirtyTabs.size > 0) {
      this.dirtyTabs.clear();
      if (this.onChange) this.onChange();
    }
  }

  /**
   * @param {string} tab
   * @returns {boolean}
   */
  isDirty(tab) {
    return this.dirtyTabs.has(tab);
  }

  /**
   * @returns {boolean}
   */
  hasUnsavedChanges() {
    return this.dirtyTabs.size > 0;
  }
}

/** @type {DirtyTracker} */
const dirtyTracker = new DirtyTracker();

// Wire DirtyTracker to CommandHistory
commandHistory.onChange = (action, command) => {
  if (command && command.tab) {
    dirtyTracker.markDirty(command.tab);

};

/**

 */
function updateTabIndicators() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const tab = btn.dataset.tab;
    const baseLabel = TAB_LABELS[tab];
    if (!baseLabel) return;
    if (dirtyTracker.isDirty(tab)) {
      btn.textContent = baseLabel + ' *';
      btn.classList.add('tab-dirty');
    } else {
      btn.textContent = baseLabel;
      btn.classList.remove('tab-dirty');
    }
  });
}

// ============================================================
// Save Functions (task-005)
// ============================================================

/**
 * Save all dirty tabs.
 * @returns {Promise<void>}
 */
async function saveAll() {
  const tabs = ['map', 'resources', 'biomes'];
  let hadError = false;
  for (const tab of tabs) {
    if (dirtyTracker.isDirty(tab)) {
      try {
        await saveTab(tab);
        dirtyTracker.markClean(tab);
      } catch (err) {
        hadError = true;
        showError(`Save failed for ${tab}: ${err.message}`);
      }
    }
  }
  if (!hadError) {
    setStatus('All changes saved.');
  }
}

/**
 * Save files for a specific tab.
 * @param {string} tab - 'map' | 'resources' | 'biomes'
 * @returns {Promise<void>}
 */
async function saveTab(tab) {
  if (tab === 'map') {
    for (const [filename, entry] of ProjectContext.files.maps) {
      const json = JSON.stringify(entry.data, null, '\t');
      await FileDiscovery.saveFile(entry.handle, json, filename);
    }
  } else if (tab === 'resources') {
    for (const [filename, entry] of ProjectContext.files.resources) {
      const text = TresParser.serialize(entry.raw);
      await FileDiscovery.saveFile(entry.handle, text, filename);
    }
  } else if (tab === 'biomes') {
    for (const [filename, entry] of ProjectContext.files.biomes) {
      const text = TresParser.serialize(entry.raw);
      await FileDiscovery.saveFile(entry.handle, text, filename);
    }
  }
}

// Wire Save button
document.getElementById('btn-save').addEventListener('click', () => saveAll());

/**
 * Show an error message in the welcome overlay or status bar.
 * @param {string} message
 * @returns {void}
 */
function showError(message) {
  const banner = document.getElementById('error-banner');
  if (banner) {
    banner.textContent = message;
    banner.classList.add('visible');
  }
  setStatus('Error: ' + message);
}

/**
 * Hide the error banner.
 * @returns {void}
 */
function hideError() {
  const banner = document.getElementById('error-banner');
  if (banner) {
    banner.textContent = '';
    banner.classList.remove('visible');
  }
}

/**
 * Update the status bar text.
 * @param {string} text
 * @returns {void}
 */
function setStatus(text) {
  const el = document.getElementById('status-text');
  if (el) el.textContent = text;
}

/**
 * Transition from welcome overlay to editor workspace.
 * @returns {void}
 */
function showEditorWorkspace() {
  document.getElementById('welcome').classList.add('hidden');
  document.getElementById('editor-workspace').classList.add('visible');
  const mapCount = ProjectContext.files.maps.size;
  const resCount = ProjectContext.files.resources.size;
  const biomeCount = ProjectContext.files.biomes.size;
  setStatus(`Project loaded: ${mapCount} map(s), ${resCount} resource(s), ${biomeCount} biome(s)`);
}

// ============================================================
// Open Project Flow (task-002)
// ============================================================

/**
 * Handle the "Open Project" button click.
 * @returns {Promise<void>}
 */
async function openProject() {
  hideError();

  if (ProjectContext.hasFileSystemAccess) {
    // File System Access API path
    try {
      const handle = await window.showDirectoryPicker();
      const result = await FileDiscovery.discoverProject(handle);
      if (!result.success) {
        showError(result.error);
        ProjectContext.rootHandle = null;
        return;
      }
    } catch (err) {
      // User cancelled the picker — AbortError
      if (err.name === 'AbortError') return;
      showError('Failed to open project: ' + err.message);
      return;
    }
  } else {
    // Fallback path — trigger file input
    const input = /** @type {HTMLInputElement} */ (document.getElementById('fallback-file-input'));
    input.value = '';
    input.click();
    return; // The change event handler will complete the flow
  }

  // Success — transition to workspace
  dirtyTracker.markAllClean();
  commandHistory.clear();
  showEditorWorkspace();
}

// Wire Open Project button
document.getElementById('btn-open-project').addEventListener('click', openProject);

// Wire fallback file input
document.getElementById('fallback-file-input').addEventListener('change', async (event) => {
  const input = /** @type {HTMLInputElement} */ (event.target);
  if (!input.files || input.files.length === 0) return;

  const result = await FileDiscovery.discoverFromFileList(input.files);
  if (!result.success) {
    showError(result.error);
    return;
  }

  dirtyTracker.markAllClean();
  commandHistory.clear();
  showEditorWorkspace();
});
