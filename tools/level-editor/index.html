// ToolManager (task-009)
// ============================================================

class ToolManager {
  /**
   * @param {HexGrid} grid
   * @param {CommandHistory} cmdHistory
   */
  constructor(grid, cmdHistory) {
    this.grid = grid;
    this.commandHistory = cmdHistory;
    /** @type {BaseTool|null} */
    this.activeTool = null;
    /** @type {string|null} */
    this.activeToolType = null;
    /** @type {string|null} */
    this.activeValue = null;
    this.elevationMode = ElevationMode.SET;
    this.elevationValue = 0;
    this.elevationDelta = 1;
  }

  /**
   * Set the active tool.
   * @param {string|null} toolType
   * @param {string|null} [value=null]
   * @returns {void}
   */
  setTool(toolType, value = null) {
    this.activeToolType = toolType;
    this.activeValue = value;

    if (!toolType) {
      this.activeTool = null;
      return;
    }

    switch (toolType) {
      case ToolType.BIOME:
        this.activeTool = new BiomeBrush(this.grid, this.commandHistory, this);
        break;
      case ToolType.ELEVATION:
        this.activeTool = new ElevationBrush(this.grid, this.commandHistory, this);
        break;
      case ToolType.RESOURCE:
        this.activeTool = new ResourcePlacer(this.grid, this.commandHistory, this);
        break;
      case ToolType.STRUCTURE:
        this.activeTool = new StructurePlacer(this.grid, this.commandHistory, this);
        break;
      case ToolType.ANOMALY:
        this.activeTool = new AnomalyMarker(this.grid, this.commandHistory, this);
        break;
      case ToolType.SPAWN:
        this.activeTool = new SpawnMarker(this.grid, this.commandHistory, this);
        break;
      case ToolType.ERASER:
        this.activeTool = new EraserTool(this.grid, this.commandHistory, this);
        break;
      case ToolType.DELETE_HEX:
        this.activeTool = new DeleteHexTool(this.grid, this.commandHistory, this);
        break;
      case ToolType.FLOOD_FILL:
        this.activeTool = new FloodFillTool(this.grid, this.commandHistory, this);
        break;
      default:
        this.activeTool = null;
    }
  }

  /** @param {{ q: number, r: number }} hex */
  onMouseDown(hex) {
    if (this.activeTool) this.activeTool.onMouseDown(hex);
  }

  /** @param {{ q: number, r: number }} hex */
  onMouseMove(hex) {
    if (this.activeTool) this.activeTool.onMouseMove(hex);
  }

  /** @param {{ q: number, r: number }|null} hex */
  onMouseUp(hex) {
    if (this.activeTool) this.activeTool.onMouseUp(hex);
  }
}

/**
 * Show an inline modal dialog with a text input.
 * @param {string} label
 * @param {string} defaultValue
 * @param {function(string|null):void} callback
 * @returns {void}
 */
function showInlineModal(label, defaultValue, callback) {
  // Remove existing modal if any
  const existing = document.getElementById('inline-modal');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.id = 'inline-modal';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:500;display:flex;align-items:center;justify-content:center;';

  const dialog = document.createElement('div');
  dialog.style.cssText = 'background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;padding:20px;min-width:320px;color:var(--text-primary);';

  const labelEl = document.createElement('div');
  labelEl.textContent = label;
  labelEl.style.cssText = 'margin-bottom:8px;font-size:14px;';

  const input = document.createElement('input');
  input.type = 'text';
  input.value = defaultValue;
  input.style.cssText = 'width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg-tertiary);color:var(--text-primary);font-size:14px;margin-bottom:12px;box-sizing:border-box;';

  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;justify-content:flex-end;gap:8px;';

  const btnCancel = document.createElement('button');
  btnCancel.textContent = 'Cancel';
  btnCancel.style.cssText = 'padding:6px 16px;border:1px solid var(--border);border-radius:4px;background:var(--bg-tertiary);color:var(--text-primary);cursor:pointer;';

  const btnOk = document.createElement('button');
  btnOk.textContent = 'OK';
  btnOk.style.cssText = 'padding:6px 16px;border:none;border-radius:4px;background:var(--accent);color:var(--bg-primary);cursor:pointer;font-weight:600;';

  const cleanup = () => overlay.remove();

  btnCancel.addEventListener('click', () => { cleanup(); callback(null); });
  btnOk.addEventListener('click', () => { cleanup(); callback(input.value); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { cleanup(); callback(input.value); }
    if (e.key === 'Escape') { cleanup(); callback(null); }
  });

  btnRow.appendChild(btnCancel);
  btnRow.appendChild(btnOk);
  dialog.appendChild(labelEl);
  dialog.appendChild(input);
  dialog.appendChild(btnRow);
  overlay.appendChild(dialog);
  document.body.appendChild(overlay);
  input.focus();
  input.select();
}

class ResourceDetailPanel {
  /**
   * @param {HTMLElement} container
   * @param {HexGrid} grid
   * @param {CommandHistory} cmdHistory
   */
  constructor(container, grid, cmdHistory) {
    this.container = container;
    this.grid = grid;
    this.commandHistory = cmdHistory;
    this.currentHex = null;
  }

  /**
   * Show panel for a hex.
   * @param {number} q
   * @param {number} r
   * @returns {void}
   */
  show(q, r) {
    this.currentHex = { q, r };
    this.container.style.display = 'block';
    this._renderContent();
  }

  /**
   * Hide the panel.
   * @returns {void}
   */
  hide() {
    this.currentHex = null;
    this.container.style.display = 'none';
    this.container.innerHTML = '';
  }

  /**
   * Re-render panel content.
   * @returns {void}
   */
  _renderContent() {
    if (!this.currentHex) return;
    const { q, r } = this.currentHex;
    const tile = this.grid.getTile(q, r);
    this.container.innerHTML = '';

    // Header
    const header = document.createElement('div');
    header.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;';
    const title = document.createElement('strong');
    title.textContent = `Resources on (${q}, ${r})`;
    title.style.fontSize = '13px';
    const closeBtn = document.createElement('button');
    closeBtn.textContent = 'X';
    closeBtn.style.cssText = 'background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:14px;padding:2px 6px;';
    closeBtn.addEventListener('click', () => this.hide());
    header.appendChild(title);
    header.appendChild(closeBtn);
    this.container.appendChild(header);

    if (!tile || !tile.resources || tile.resources.length === 0) {
      const empty = document.createElement('div');
      empty.textContent = 'No resources on this hex.';
      empty.style.cssText = 'color:var(--text-secondary);font-size:12px;';
      this.container.appendChild(empty);
      return;
    }

    tile.resources.forEach((res, index) => {
      const row = document.createElement('div');
      row.style.cssText = 'border:1px solid var(--border);border-radius:4px;padding:8px;margin-bottom:6px;background:var(--bg-tertiary);';

      // Type label
      const typeLabel = document.createElement('div');
      typeLabel.textContent = res.type;
      typeLabel.style.cssText = 'font-weight:600;font-size:12px;margin-bottom:4px;color:var(--accent);';
      row.appendChild(typeLabel);

      // Input fields
      const fields = [
        { name: 'x', value: res.x, min: -1.0, max: 1.0, step: 0.1 },
        { name: 'y', value: res.y, min: -1.0, max: 1.0, step: 0.1 },
        { name: 'rotation', value: res.rotation, min: 0, max: 359, step: 1 },
      ];

      const fieldsRow = document.createElement('div');
      fieldsRow.style.cssText = 'display:flex;gap:6px;align-items:center;flex-wrap:wrap;';

      for (const field of fields) {
        const label = document.createElement('label');
        label.style.cssText = 'font-size:11px;color:var(--text-secondary);display:flex;align-items:center;gap:2px;';
        label.textContent = field.name + ':';
        const input = document.createElement('input');
        input.type = 'number';
        input.value = field.name === 'rotation' ? String(Math.round(field.value)) : String(parseFloat(field.value.toFixed(2)));
        input.min = String(field.min);
        input.max = String(field.max);
        input.step = String(field.step);
        input.style.cssText = 'width:60px;padding:2px 4px;border:1px solid var(--border);border-radius:3px;background:var(--bg-secondary);color:var(--text-primary);font-size:12px;';
        input.dataset.resourceIndex = String(index);
        input.dataset.field = field.name;

        const origValue = field.value;
        const handleChange = () => {
          const newVal = parseFloat(input.value);
          if (isNaN(newVal)) return;
          const clamped = Math.max(field.min, Math.min(field.max, newVal));
          if (clamped === origValue) return;
          const oldValues = { [field.name]: origValue };
          const newValues = { [field.name]: clamped };
          const cmd = new EditResourceCommand(this.grid, q, r, index, oldValues, newValues);
          this.commandHistory.execute(cmd);
          this._renderContent(); // refresh
        };

        input.addEventListener('blur', handleChange);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleChange(); });
        label.appendChild(input);
        fieldsRow.appendChild(label);
      }

      // Delete button
      const delBtn = document.createElement('button');
      delBtn.textContent = 'X';
      delBtn.title = 'Delete resource';
      delBtn.style.cssText = 'background:var(--danger);color:white;border:none;border-radius:3px;padding:2px 6px;cursor:pointer;font-size:11px;font-weight:bold;margin-left:auto;';
      delBtn.addEventListener('click', () => {
        const removed = { ...tile.resources[index] };
        const cmd = new DeleteResourceCommand(this.grid, q, r, index, removed);
        this.commandHistory.execute(cmd);
        this._renderContent(); // refresh
      });
      fieldsRow.appendChild(delBtn);

      row.appendChild(fieldsRow);
      this.container.appendChild(row);
    });
  }
}

class DirtyTracker {
  constructor() {
    /** @type {Set<string>} */
    this.dirtyTabs = new Set();
    /** @type {function():void|null} */
    this.onChange = null;
  }

  /**
   * Mark a tab as dirty.
   * @param {string} tab - 'map' | 'resources' | 'biomes'
   * @returns {void}
   */
  markDirty(tab) {
    if (!this.dirtyTabs.has(tab)) {
      this.dirtyTabs.add(tab);
      if (this.onChange) this.onChange();
    }
  }

  /**
   * Clear dirty flag for a tab.
   * @param {string} tab
   * @returns {void}
   */
  markClean(tab) {
    if (this.dirtyTabs.has(tab)) {
      this.dirtyTabs.delete(tab);
      if (this.onChange) this.onChange();
    }
  }

  /**
   * Clear all dirty flags.
   * @returns {void}
   */
  markAllClean() {
    if (this.dirtyTabs.size > 0) {
      this.dirtyTabs.clear();
      if (this.onChange) this.onChange();
    }
  }

  /**
   * @param {string} tab
   * @returns {boolean}
   */
  isDirty(tab) {
    return this.dirtyTabs.has(tab);
  }

  /**
   * @returns {boolean}
   */
  hasUnsavedChanges() {
    return this.dirtyTabs.size > 0;
  }
}

/** @type {DirtyTracker} */
const dirtyTracker = new DirtyTracker();

// Wire DirtyTracker to CommandHistory
commandHistory.onChange = (action, command) => {

};

      btn.textContent = baseLabel;
      btn.classList.remove('tab-dirty');
    }
  });
}

// Save Functions (task-005)
// ============================================================

/**
 * Save all dirty tabs.
 * @returns {Promise<void>}
 */
async function saveAll() {
  const tabs = ['map', 'resources', 'biomes'];
  let hadError = false;
  for (const tab of tabs) {
    if (dirtyTracker.isDirty(tab)) {
      try {
        await saveTab(tab);
        dirtyTracker.markClean(tab);
      } catch (err) {
        hadError = true;
        showError(`Save failed for ${tab}: ${err.message}`);
      }
    }
  }
  if (!hadError) {
    setStatus('All changes saved.');
  }
}

/**
 * Save files for a specific tab.
 * @param {string} tab - 'map' | 'resources' | 'biomes'
 * @returns {Promise<void>}
 */
async function saveTab(tab) {
  if (tab === 'map') {
    // Serialize from the live HexGrid model
    const mapData = serializeGridToMapJson();
    for (const [filename, entry] of ProjectContext.files.maps) {
      entry.data = mapData;
      const json = JSON.stringify(entry.data, null, '\t');
      await FileDiscovery.saveFile(entry.dir || 'data/maps', json, filename);
    }
  } else if (tab === 'resources') {
    for (const [filename, entry] of ProjectContext.files.resources) {
      const text = TresParser.serialize(entry.raw);
      await FileDiscovery.saveFile(entry.dir || 'data/resources', text, filename);
    }
  } else if (tab === 'biomes') {
    for (const [filename, entry] of ProjectContext.files.biomes) {
      const text = TresParser.serialize(entry.raw);
      await FileDiscovery.saveFile(entry.dir || 'data/biomes', text, filename);
    }
  }
}

/**
 * Auto-discover and load project files via the dev server API on page load.
 * @returns {Promise<void>}
 */
async function autoLoadProject() {
  console.log('autoLoadProject: starting...');
  setStatus('Loading project...');

  const result = await FileDiscovery.discoverViaApi();
  if (!result.success) {
    console.error(`autoLoadProject: Discovery failed — ${result.error}`);
    setStatus('Error: ' + result.error);
    return;
  }

  console.log('autoLoadProject: Discovery succeeded. Initializing...');
  dirtyTracker.markAllClean();
  commandHistory.clear();
  initializeAfterLoad();

  const mapCount = ProjectContext.files.maps.size;
  const resCount = ProjectContext.files.resources.size;
  const biomeCount = ProjectContext.files.biomes.size;
  setStatus(`Project loaded: ${mapCount} map(s), ${resCount} resource(s), ${biomeCount} biome(s)`);
  console.log('autoLoadProject: Workspace ready.');
}

autoLoadProject();

/**
 * Post-load initialization: load first map into grid, build biome color map.
 * @returns {void}
 */
function initializeAfterLoad() {
  console.group('initializeAfterLoad');

  // Build biome color map from loaded .tres data
  biomeColorMap.clear();
  for (const [filename, entry] of ProjectContext.files.biomes) {
    const colorField = entry.raw.resourceFields.get('color');
    if (colorField && colorField.type === 'color') {
      const biomeName = filename.replace('.tres', '');
      const c = colorField.value;
      const r = Math.round(c.r * 255);
      const g = Math.round(c.g * 255);
      const b = Math.round(c.b * 255);
      biomeColorMap.set(biomeName, `rgb(${r},${g},${b})`);
      console.log(`  Biome color: "${biomeName}" -> rgb(${r},${g},${b})`);
    } else {
      console.warn(`  Biome "${filename}" has no valid color field.`);
    }
  }
  console.log(`Biome color map built — ${biomeColorMap.size} entries.`);

  // Load first map into grid
  const firstMap = ProjectContext.files.maps.entries().next();
  if (!firstMap.done) {
    const [mapName, mapEntry] = firstMap.value;
    const tileCount = mapEntry.data.tiles ? Object.keys(mapEntry.data.tiles).length : 0;
    console.log(`Loading map "${mapName}" into grid — ${tileCount} tiles.`);
    loadMapIntoGrid(mapEntry.data);
    console.log(`Grid loaded — ${hexGrid.tiles.size} tiles in HexGrid.`);
  } else {
    console.warn('No maps found in ProjectContext. Grid will be empty.');
  }

  // Resize and center map — must happen after workspace is visible
  // so the canvas gets correct dimensions from its parent.
  if (hexCanvas) {
    hexCanvas._onResize();
    hexCanvas.fitToView();
    console.log('Canvas resized and map centered.');
  } else {
    console.warn('hexCanvas is null — canvas not initialized.');
  }

  console.groupEnd();
}
